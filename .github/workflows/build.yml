name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild -project ScooterTune.xcodeproj \
            -scheme ScooterTune \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/ScooterTune.app build/Payload/
          cd build
          zip -r ScooterTune.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScooterTune-ipa
          path: build/ScooterTune.ipa